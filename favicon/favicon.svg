<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6af5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c26aff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b8fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0a0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <!-- ✦ four-pointed star symbol -->
  <text x="16" y="22" 
        font-family="serif" 
        font-size="18" 
        font-weight="bold"
        fill="white" 
        text-anchor="middle"
        opacity="0.95">✦</text>
</svg>